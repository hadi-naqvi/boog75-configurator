server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    # Behind a reverse proxy: trust its scheme so absolute redirects stay https.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "hid=(self), usb=(), camera=(), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Always revalidate so updates reach browsers immediately (files are tiny).
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Nothing else is served.
    location ~ /\. { deny all; }
}
